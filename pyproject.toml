[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-clarity"
dynamic = ["version"]
description = "Self-hosted session replay, heatmaps and rules-based behaviour signals for Django"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The recorder bundle ships in the wheel, so its notices ship with it.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Meharaj Ul Mahmmud" }]
keywords = ["session-replay", "heatmaps", "rrweb", "django", "analytics", "privacy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = []

[project.optional-dependencies]
django = ["Django>=5.2", "rjsmin>=1.2"]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.6", "build>=1"]

[tool.hatch.version]
path = "src/oss_clarity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_clarity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.django.settings"
django_find_project = false
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["js/node_modules"]

[tool.ruff.format]
exclude = ["src/oss_clarity/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations, and JavaScript held in a Python string.
"src/oss_clarity/migrations/*" = ["E501"]
"src/oss_clarity/tracker.py" = ["E501"]

[tool.ruff.lint.isort]
# `tests/django` is the test project, not the framework.
known-third-party = ["django"]
