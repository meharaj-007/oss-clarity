<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bike workshop · {{ name|title }}</title>
  {% if site %}<script async src="/oc/t/{{ site.public_key }}.js"></script>{% endif %}
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2937; }
    header { background: #1e3a5f; padding: 16px 24px; }
    header a { color: #fff; margin-right: 16px; }
    main { padding: 24px; max-width: 900px; }
    .cost { font-size: 28px; color: #b45309; }
    .panel { margin-top: 20px; padding: 30px; border: 1px solid #d1d5db; }
    .tall { height: 1600px; background: linear-gradient(#fff, #e0f2fe); }
    button { padding: 10px 18px; font-size: 16px; }
    .setup { background: #fef3c7; padding: 12px 24px; }
  </style>
</head>
<body>
  {% if not site %}
    <p class="setup">Run <code>python manage.py example_site</code> first, then reload.</p>
  {% endif %}
  <header><nav><a href="/">Home</a><a href="/pricing/">Pricing</a><a href="/contact/">Contact</a></nav></header>
  <main>
    <h1>{{ name|title }}</h1>
    <p>We repair bicycles of every size. A service starts at <span class="cost">$49</span>.</p>
    <button id="book">Book a service</button>
    <div class="panel" id="dead">This panel does nothing when clicked. Click it a few times fast.</div>
    <form class="panel" onsubmit="return false">
      <label>Email <input name="email" type="email"></label>
      <button type="submit">Send</button>
    </form>
    <div class="tall"></div>
    <footer>Call 0400 000 000</footer>
  </main>
</body>
</html>
